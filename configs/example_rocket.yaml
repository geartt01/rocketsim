# Example rocket: a generic small single-stage model rocket (BT-50 size) on an Estes C6.
# The airframe numbers are illustrative, not a specific kit. SI units; angles in degrees.
# Axial positions are measured from the nose tip, positive aft.

rocket:
  nose:
    shape: ogive          # cone | ogive (tangent) | elliptical | von_karman
    length: 0.080         # m
    mass: 0.005           # kg
  body:
    length: 0.300         # m, tube from nose base to aft end
    diameter: 0.0248      # m, outer diameter (BT-50)
    mass: 0.012           # kg
  fins:
    count: 3
    root_chord: 0.060     # m
    tip_chord: 0.030      # m
    span: 0.045           # m, root to tip
    sweep: 0.030          # m, tip leading edge aft of root leading edge
    thickness: 0.0024     # m (3/32" balsa)
    position: 0.320       # m, nose tip to root leading edge (fins end flush with the tube)
    profile: rounded      # square | rounded | airfoil
    mass: 0.005           # kg, whole set
  masses:                 # point masses; add length + radius for a solid cylinder
    - {name: parachute and shock cord, mass: 0.008, position: 0.140}
    - {name: motor mount and hook, mass: 0.004, position: 0.330}
  motor_position: 0.380   # m, nose tip to the motor's aft end (flush with the tube)
  surface_roughness: 60.0e-6   # m, regular paint (Niskanen Table 3.2 ranges 5-200 um)
  drag: buildup           # buildup | a constant Cd (e.g. 0.5) | path to a 'mach,cd' CSV

motor: ../motors/Estes_C6.eng   # RASP file, path relative to this config file

recovery:                 # chutes stay attached once out; Cd*A grows linearly over fill_time
  drogue:                 # a single-chute model rocket uses only this one
    cda: 0.0565           # m^2, Cd*A of a 30 cm parachute (Cd 0.8 * pi * 0.15^2)
    fill_time: 0.3        # s from deployment to fully open
    delay: 0.0            # s after apogee (e.g. a late motor ejection charge)
  # main:                 # optional second chute
  #   cda: 0.30           # m^2
  #   fill_time: 0.5      # s
  #   altitude: 150.0     # m above the launch site, deploys while descending through it

launch:
  site_altitude: 0.0      # m above mean sea level
  rail_length: 0.9        # m travelled along the launch rod before the rocket is free
  rail_elevation: 85.0    # deg above horizontal
  rail_heading: 90.0      # deg clockwise from North that the rail leans toward (90 = East)

wind:
  speed: 3.0              # m/s at reference_height
  direction: 270.0        # deg clockwise from North the wind blows FROM (270 = from the West)
  reference_height: 10.0  # m
  profile: power_law      # constant | power_law (1/7 exponent)

# Monte Carlo (python -m rocketsim montecarlo ...). Each entry: {normal: [mean, sigma]} or
# {uniform: [low, high]}. *_scale multiply the nominal; the others add to it, except
# thrust_misalignment and gust_intensity (absolute). Omitted parameters are not varied.
# Spreads below are illustrative, typical of hobby-rocket uncertainty.
dispersions:
  impulse_scale:       {normal: [1.0, 0.03]}
  burn_time_scale:     {normal: [1.0, 0.03]}
  cd_scale:            {normal: [1.0, 0.07]}
  dry_mass:            {normal: [0.0, 0.001]}   # kg
  cg_offset:           {normal: [0.0, 0.005]}   # m, aft positive
  rail_elevation:      {normal: [0.0, 1.0]}     # deg
  rail_heading:        {normal: [0.0, 3.0]}     # deg
  thrust_misalignment: {normal: [0.0, 0.2]}     # deg
  wind_speed:          {normal: [0.0, 1.0]}     # m/s
  wind_direction:      {normal: [0.0, 15.0]}    # deg
  gust_intensity:      {uniform: [0.0, 0.6]}    # m/s, turbulence sigma (~10-20 % of the wind)
  chute_cda_scale:     {normal: [1.0, 0.07]}
  drogue_delay:        {uniform: [0.0, 1.0]}    # s

# Simulated sensor logs (python -m rocketsim sensors ...). YAML uses g and deg/s.
# Noise sigma per sample = noise density * sqrt(bandwidth), bandwidth = half the sample rate.
sensors:
  imu_rate: 500           # Hz
  baro_rate: 50           # Hz, must divide imu_rate
  pad_time: 2.0           # s logged before ignition (t < 0), for flight-computer calibration
  landed_time: 2.0        # s logged after landing
  accel:                  # MPU-6050 datasheet: +-16 g max, 16-bit, 400 ug/sqrt(Hz)
    range_g: 16.0
    bits: 16
    noise_g: 0.00632      # 400e-6 * sqrt(250 Hz)
    bias_g: [0.02, -0.015, 0.03]   # illustrative, inside the +-50 to 80 mg zero-g tolerance
    scale_error: 0.005    # illustrative, inside the +-3 % sensitivity tolerance
  gyro:                   # MPU-6050 datasheet: +-2000 deg/s max, 16-bit, 0.005 deg/s/sqrt(Hz)
    range_dps: 2000.0
    bits: 16
    noise_dps: 0.0791     # 0.005 * sqrt(250 Hz)
    bias_dps: [0.5, -0.4, 0.3]     # illustrative, inside the +-20 deg/s zero-rate tolerance
    walk_dps_per_sqrt_s: 0.002     # illustrative: the datasheet gives no value
  baro:                   # BMP280 datasheet, ultra-high-resolution mode
    noise_pa: 1.3
    resolution_pa: 0.16
