[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim"
version = "0.0.0"
description = "6-DOF model-rocket flight simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
validation = ["rocketpy"]

[tool.setuptools.packages.find]
include = ["rocketsim*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
